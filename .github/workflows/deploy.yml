name: CI/CD Pipeline

on:
  push:
    branches:
      - main # Triggers when code pushes to your primary branch

permissions:
  contents: read
  packages: write # Necessary to publish images to ghcr.io

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/mediraksha-app:latest
            ghcr.io/${{ github.actor }}/mediraksha-app:${{ github.sha }}


  deploy:
    runs-on: ubuntu-latest
    needs: [ app ]
    steps:
      - name: Trigger Render Backend Redeploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_WEBHOOK_URL_APP }}"
